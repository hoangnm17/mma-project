services:
  mongo:
    image: mongo:8.0
    command:
      [mongod, --replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    ports: ["127.0.0.1:${MONGO_PORT:-27027}:27017"]
    volumes: [stayflow-mongo:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: [mongosh, "--host", "mongo:27017", "--quiet", "--eval"]
    command:
      - 'try { rs.status() } catch (e) { if (e.code === 94) rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); else throw e; } for(let i=0;i<60;i++){if(db.hello().isWritablePrimary) quit(0); sleep(1000);} quit(1);'
volumes:
  stayflow-mongo:
