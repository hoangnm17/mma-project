services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?required}
      MSSQL_MEMORY_LIMIT_MB: 2048
    volumes: [sql-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: ..
      args:
        PUBLIC_API_URL: https://${DOMAIN:?required}
    env_file: .env
    environment:
      SQL_SERVER: sqlserver
      SQL_PORT: 1433
      SQL_USER: sa
      SQL_ENCRYPT: 'false'
      SQL_TRUST_CERT: 'true'
    command: [sh, -c, 'node scripts/migrate.js && node scripts/provision-runtime.js && node scripts/bootstrap-admin.js']
    depends_on:
      sqlserver: {condition: service_healthy}
  api:
    build:
      context: ..
      args:
        PUBLIC_API_URL: https://${DOMAIN:?required}
    restart: unless-stopped
    env_file: .env
    environment:
      SQL_SERVER: sqlserver
      SQL_PORT: 1433
      SQL_USER: stayflow_app
      SQL_PASSWORD: ${APP_SQL_PASSWORD:?required}
      SQL_ENCRYPT: 'false'
      SQL_TRUST_CERT: 'true'
      CORS_ORIGINS: https://${DOMAIN}
      GUEST_WEB_URL: https://${DOMAIN}/guest
    depends_on:
      migrate: {condition: service_completed_successfully}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: {DOMAIN: '${DOMAIN:?required}'}
    ports: ['80:80', '443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: [api]
volumes:
  sql-data:
  caddy-data:
  caddy-config:
